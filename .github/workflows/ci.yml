name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The gate is ~2 min; anything near this is hung, not slow. Without it a
    # wedged run burns the 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor and in maintenance until 2027-04; 24 is the
        # active LTS and what dev runs on (.nvmrc). Node 20 was dropped when it
        # went EOL 2026-04-30 — an EOL runtime is not a support claim worth
        # verifying.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # lint && build (build includes tsc --noEmit) && test — the same gate as local.
      # The build's vault copy is a no-op here: no vault exists on a runner.
      - run: npm run check

      # Boots the rig and asserts every view mounts. Kept out of `npm run check`
      # so the local loop stays fast and browser-free; `npm run check:all` is the
      # local equivalent of this job. It catches what `check` structurally
      # cannot — the rig's plugin mock going stale — because the mount sites cast
      # through `as never`. Runs on the runner image's preinstalled Chrome; the
      # rig stubs the Obsidian CSS it can't vendor here, which is fine because
      # mounting is a JS property, not a visual one.
      - run: npm run rig:smoke
