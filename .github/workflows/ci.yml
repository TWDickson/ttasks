name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the engines floor (vite 5 needs it); 22 is what dev runs on.
        node: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # lint && build (build includes tsc --noEmit) && test — the same gate as local.
      # The build's vault copy is a no-op here: no vault exists on a runner.
      - run: npm run check
