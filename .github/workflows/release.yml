name: Release

# Tags are bare semver with no `v` prefix — the community-plugin submission
# checker requires the tag to equal manifest.json's version exactly, and BRAT
# resolves a release the same way.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches manifest.json and versions.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          MIN_APP_VERSION=$(node -p "require('./manifest.json').minAppVersion")
          MAPPED=$(node -p "require('./versions.json')['${TAG}'] ?? ''")

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match manifest.json version ${MANIFEST_VERSION}. Run \`npm version\` (which runs version-bump.mjs) before tagging."
            exit 1
          fi
          if [ "$MAPPED" != "$MIN_APP_VERSION" ]; then
            echo "::error::versions.json has '${TAG}': '${MAPPED}', expected minAppVersion '${MIN_APP_VERSION}'."
            exit 1
          fi

      - run: npm ci

      # Same gate as CI — a release build is the one that reaches devices.
      - run: npm run check

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
